version: 0.2

env:
  variables:
    AWS_REGION: "eu-west-1"
    ECR_REPO: "ecommerce-backend"
    CONTAINER_NAME: "ecommerce-api"
    SPA_BUCKET: "cs436-ecommerce-spa-185472107290"
    CLOUDFRONT_DIST_ID: "E2E8FKVPNLX524"
    # ACCOUNT_ID is injected as a CodeBuild project env var (from Step 27).

phases:
  install:
    runtime-versions:
      nodejs: 20 # Vite needs Node 18+; 20 is provided by the AL2 standard:5.0 image

  pre_build:
    commands:
      - echo "Logging in to Amazon ECR…"
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
      - cd "$CODEBUILD_SRC_DIR/team_20_308_project_backend"
      - npm audit --omit=dev || true

  build:
    commands:
      # ---------- Backend: build + push image ----------
      - cd "$CODEBUILD_SRC_DIR/team_20_308_project_backend"
      - REPO_URI="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO"
      - echo "Building backend $REPO_URI:$CODEBUILD_RESOLVED_SOURCE_VERSION"
      - docker build -t "$REPO_URI:$CODEBUILD_RESOLVED_SOURCE_VERSION" -t "$REPO_URI:latest" .
      - docker push "$REPO_URI:$CODEBUILD_RESOLVED_SOURCE_VERSION"
      - docker push "$REPO_URI:latest"
      # ---------- Frontend: Vite build + S3 sync + CloudFront invalidation ----------
      - cd "$CODEBUILD_SRC_DIR/team20_308_project_frontend"
      - npm ci
      # 🔴 /api (with the path!) — same-origin; CloudFront routes /api/* to the ALB
      - VITE_API_URL=/api npm run build
      - aws s3 sync dist/ "s3://$SPA_BUCKET/" --delete
      - aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DIST_ID" --paths "/*"

  post_build:
    commands:
      - REPO_URI="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO"
      - printf '[{"name":"%s","imageUri":"%s"}]' "$CONTAINER_NAME" "$REPO_URI:$CODEBUILD_RESOLVED_SOURCE_VERSION" > "$CODEBUILD_SRC_DIR/imagedefinitions.json"
      - cat "$CODEBUILD_SRC_DIR/imagedefinitions.json"

artifacts:
  files:
    - imagedefinitions.json
